<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Flight Detector - Complete Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background-color: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; max-height: 300px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 10px 0; }
        .stat-card { background: white; padding: 15px; border-radius: 5px; text-align: center; border: 1px solid #ddd; }
        .stat-value { font-size: 24px; font-weight: bold; color: #007bff; }
        .stat-label { font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <h1>🛩️ Live Flight Detector - Complete System Test</h1>
    
    <div class="test-section info">
        <h3>System Status</h3>
        <div id="system-status">Testing...</div>
    </div>

    <div class="test-section">
        <h3>Data Collection</h3>
        <button onclick="collectData()">Collect Flight Data</button>
        <button onclick="testAllEndpoints()">Test All Endpoints</button>
        <div id="collection-results"></div>
    </div>

    <div class="test-section">
        <h3>Flight Statistics</h3>
        <div id="statistics-display" class="stats-grid"></div>
    </div>

    <div class="test-section">
        <h3>Neo4j Queries</h3>
        <button onclick="testSimpleQueries()">Test Simple Queries</button>
        <button onclick="testComplexQueries()">Test Complex Queries</button>
        <div id="queries-results"></div>
    </div>

    <div class="test-section">
        <h3>EDA Analysis</h3>
        <button onclick="testEDA()">Test EDA Analysis</button>
        <div id="eda-results"></div>
    </div>

    <div class="test-section">
        <h3>Flight Map Visualization</h3>
        <div id="map-container" style="height: 400px; border: 1px solid #ddd; border-radius: 5px; position: relative;">
            <div id="map-placeholder" style="display: flex; align-items: center; justify-content: center; height: 100%; color: #666;">
                Click "Test All Endpoints" to load flight map
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:9000/api';
        let flightData = [];

        async function testAllEndpoints() {
            updateStatus('Testing all endpoints...', 'info');
            
            try {
                // Test basic connectivity
                await testConnection();
                
                // Collect data
                await collectData();
                
                // Test all endpoints
                await Promise.all([
                    testStatistics(),
                    testSimpleQueries(),
                    testComplexQueries(),
                    testEDA()
                ]);
                
                // Update map
                updateFlightMap();
                
                updateStatus('✅ All tests completed successfully!', 'success');
            } catch (error) {
                updateStatus(`❌ Test failed: ${error.message}`, 'error');
            }
        }

        async function testConnection() {
            const response = await fetch(`${API_BASE}/test`);
            const data = await response.json();
            console.log('Connection test:', data);
        }

        async function collectData() {
            try {
                const response = await fetch(`${API_BASE}/collect-once`, { method: 'POST' });
                const data = await response.json();
                document.getElementById('collection-results').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                
                // Fetch flight data
                const flightsResponse = await fetch(`${API_BASE}/flights`);
                const flightsData = await flightsResponse.json();
                flightData = flightsData.flights || [];
                
                return data;
            } catch (error) {
                document.getElementById('collection-results').innerHTML = `<div class="error">Error: ${error.message}</div>`;
                throw error;
            }
        }

        async function testStatistics() {
            try {
                const response = await fetch(`${API_BASE}/statistics`);
                const data = await response.json();
                
                const statsHtml = `
                    <div class="stat-card">
                        <div class="stat-value">${data.total_flights || 0}</div>
                        <div class="stat-label">Total Flights</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${data.flights_in_air || 0}</div>
                        <div class="stat-label">In Air</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${data.flights_on_ground || 0}</div>
                        <div class="stat-label">On Ground</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${Math.round(data.avg_altitude || 0)}</div>
                        <div class="stat-label">Avg Altitude (ft)</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${Math.round(data.avg_velocity || 0)}</div>
                        <div class="stat-label">Avg Velocity (m/s)</div>
                    </div>
                `;
                
                document.getElementById('statistics-display').innerHTML = statsHtml;
                return data;
            } catch (error) {
                document.getElementById('statistics-display').innerHTML = `<div class="error">Statistics Error: ${error.message}</div>`;
                throw error;
            }
        }

        async function testSimpleQueries() {
            try {
                const response = await fetch(`${API_BASE}/queries/simple`);
                const data = await response.json();
                document.getElementById('queries-results').innerHTML = `
                    <h4>Simple Queries Results:</h4>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                return data;
            } catch (error) {
                document.getElementById('queries-results').innerHTML = `<div class="error">Simple Queries Error: ${error.message}</div>`;
                throw error;
            }
        }

        async function testComplexQueries() {
            try {
                const response = await fetch(`${API_BASE}/queries/complex`);
                const data = await response.json();
                document.getElementById('queries-results').innerHTML += `
                    <h4>Complex Queries Results:</h4>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                return data;
            } catch (error) {
                document.getElementById('queries-results').innerHTML += `<div class="error">Complex Queries Error: ${error.message}</div>`;
                throw error;
            }
        }

        async function testEDA() {
            try {
                const response = await fetch(`${API_BASE}/eda`);
                const data = await response.json();
                document.getElementById('eda-results').innerHTML = `
                    <h4>EDA Analysis Results:</h4>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                return data;
            } catch (error) {
                document.getElementById('eda-results').innerHTML = `<div class="error">EDA Error: ${error.message}</div>`;
                throw error;
            }
        }

        function updateFlightMap() {
            const container = document.getElementById('map-container');
            const placeholder = document.getElementById('map-placeholder');
            
            if (flightData.length === 0) {
                placeholder.innerHTML = 'No flight data available';
                return;
            }

            const inAirFlights = flightData.filter(f => !f.on_ground);
            const onGroundFlights = flightData.filter(f => f.on_ground);

            container.innerHTML = `
                <div style="padding: 20px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                        <div style="text-align: center;">
                            <div style="font-size: 24px; color: #28a745; font-weight: bold;">${inAirFlights.length}</div>
                            <div style="font-size: 12px; color: #666;">Flights in Air</div>
                        </div>
                        <div style="text-align: center;">
                            <div style="font-size: 24px; color: #ffc107; font-weight: bold;">${onGroundFlights.length}</div>
                            <div style="font-size: 12px; color: #666;">Flights on Ground</div>
                        </div>
                    </div>
                    
                    <div style="height: 300px; border: 1px solid #dee2e6; border-radius: 4px; position: relative; overflow: hidden;">
                        <svg width="100%" height="100%" style="background: linear-gradient(135deg, #87CEEB 0%, #98FB98 100%);">
                            ${flightData.slice(0, 20).map((flight, index) => {
                                const x = ((flight.longitude + 180) / 360) * 100;
                                const y = ((90 - flight.latitude) / 180) * 100;
                                const isInAir = !flight.on_ground;
                                const color = isInAir ? '#dc3545' : '#ffc107';
                                const size = isInAir ? 6 : 4;
                                
                                return `
                                    <g>
                                        <circle cx="${x}%" cy="${y}%" r="${size}" fill="${color}" stroke="white" stroke-width="1" />
                                        ${isInAir ? `<circle cx="${x}%" cy="${y}%" r="${size + 2}" fill="none" stroke="${color}" stroke-width="1" opacity="0.5" />` : ''}
                                    </g>
                                `;
                            }).join('')}
                            
                            <g transform="translate(10, 10)">
                                <rect x="0" y="0" width="120" height="60" fill="rgba(255,255,255,0.9)" rx="4" />
                                <text x="10" y="20" font-size="12" font-weight="bold">Legend</text>
                                <circle cx="15" cy="35" r="4" fill="#dc3545" />
                                <text x="25" y="40" font-size="10">In Air</text>
                                <circle cx="15" cy="50" r="3" fill="#ffc107" />
                                <text x="25" y="55" font-size="10">On Ground</text>
                            </g>
                        </svg>
                    </div>
                    
                    <div style="margin-top: 10px; text-align: center; color: #666; font-size: 12px;">
                        Showing ${Math.min(flightData.length, 20)} of ${flightData.length} flights
                    </div>
                </div>
            `;
        }

        function updateStatus(message, type) {
            const statusEl = document.getElementById('system-status');
            statusEl.textContent = message;
            statusEl.className = `test-section ${type}`;
        }

        // Auto-test on page load
        window.onload = () => {
            testAllEndpoints();
        };
    </script>
</body>
</html>
