<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Flight Detector - Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background-color: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🛩️ Live Flight Detector - Connection Test</h1>
    
    <div id="status" class="status info">
        Testing connection...
    </div>
    
    <div>
        <button onclick="testConnection()">Test Backend Connection</button>
        <button onclick="fetchFlights()">Fetch Flights</button>
        <button onclick="collectData()">Collect Data</button>
    </div>
    
    <div id="results"></div>

    <script>
        const statusDiv = document.getElementById('status');
        const resultsDiv = document.getElementById('results');
        
        function updateStatus(message, type = 'info') {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }
        
        function updateResults(data) {
            resultsDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
        }
        
        async function testConnection() {
            try {
                updateStatus('Testing backend connection...', 'info');
                const response = await fetch('http://localhost:9000/api/test');
                const data = await response.json();
                updateStatus('✅ Backend connection successful!', 'success');
                updateResults(data);
            } catch (error) {
                updateStatus(`❌ Backend connection failed: ${error.message}`, 'error');
                updateResults({ error: error.message });
            }
        }
        
        async function fetchFlights() {
            try {
                updateStatus('Fetching flights...', 'info');
                const response = await fetch('http://localhost:9000/api/flights');
                const data = await response.json();
                updateStatus(`✅ Fetched ${data.count} flights`, 'success');
                updateResults(data);
            } catch (error) {
                updateStatus(`❌ Failed to fetch flights: ${error.message}`, 'error');
                updateResults({ error: error.message });
            }
        }
        
        async function collectData() {
            try {
                updateStatus('Collecting data...', 'info');
                const response = await fetch('http://localhost:9000/api/collect-once', {
                    method: 'POST'
                });
                const data = await response.json();
                updateStatus('✅ Data collection successful!', 'success');
                updateResults(data);
                
                // Auto-fetch flights after collection
                setTimeout(fetchFlights, 1000);
            } catch (error) {
                updateStatus(`❌ Data collection failed: ${error.message}`, 'error');
                updateResults({ error: error.message });
            }
        }
        
        // Auto-test connection on page load
        window.onload = testConnection;
    </script>
</body>
</html>
